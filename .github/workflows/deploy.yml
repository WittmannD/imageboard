name: Build & Deploy

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REPO: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        app: [image-processor, image-server]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npx nx run-many -t build --projects="packages/*"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Docker metadata
        id: meta
        run: |
          REPO_LC=$(echo "${{ env.REPO }}" | tr '[:upper:]' '[:lower:]')
          APP_LC=$(echo "${{ matrix.app }}" | tr '[:upper:]' '[:lower:]')
          
          echo "repo=$REPO_LC" >> $GITHUB_OUTPUT
          echo "app=$APP_LC" >> $GITHUB_OUTPUT

      - name: Build & push ${{ matrix.app }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}-${{ steps.meta.outputs.app }}:latest
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.repo }}-${{ steps.meta.outputs.app }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
          
            mkdir -p /opt/${{ env.REPO }}
            cd /opt/${{ env.REPO }}
            CONFIG_URL="https://raw.githubusercontent.com/WittmannD/imageboard/${{ github.sha }}/docker-compose-ci.yaml"
            echo "Get docker compose config from ${CONFIG_URL}"
            wget -O docker-compose.yaml "$CONFIG_URL"
          
            docker compose -f docker-compose.yaml pull
            docker compose -f docker-compose.yaml up -d
          
            docker image prune -f
