name: Build & Deploy

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REPO: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        app: [image-processor, image-server]

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.app }}
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.app }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO }}-${{ matrix.app }}:latest
            ${{ env.REGISTRY }}/${{ env.REPO }}-${{ matrix.app }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
          
            cd /opt/${{ env.REPO }}
            wget -O docker-compose.yaml https://raw.githubusercontent.com/WittmannD/imageboard/${{ github.sha }}/docker-compose-ci.yaml
          
            docker compose -f docker-compose.yaml pull
            docker compose -f docker-compose.yaml up -d
          
            for svc in auth api worker; do
              echo "Checking $svc health..."
              for i in {1..20}; do
                STATUS=$(docker inspect --format='{{.State.Health.Status}}' $svc || echo "starting")
                if [ "$STATUS" = "healthy" ] || [ "$STATUS" = "none" ]; then
                  echo "✅ $svc OK"
                  break
                fi
                sleep 5
              done
            done
          
            docker image prune -f
