name: Deploy Staging

# Builds every image for the staging profile and starts that exact commit on
# the staging server; see deploy-reusable.yml.

on:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      environment: staging
      url: https://staging.spottish.website
    secrets: inherit
