# Self-contained stack for the Playwright suite (`npm run stack:up -w imageboard-e2e`).
#
# It is isolated from the dev stack in ../../docker-compose.yaml: its own
# project name, no fixed container names, no host port 80, and throwaway
# state (nothing is persisted). Both can run side by side.
#
# What is real:  client, API, identity provider, image-processor, Postgres,
#                Redis and nginx, wired together the way they are in production
#                (same OIDC issuer, redirect URI and cookie domain for the
#                browser and for the containers).
# What is faked: SMTP    -> Mailpit (the tests read OTP emails from its API)
#                S3      -> MinIO   (public-read bucket, replaces S3)
#
# Configuration: the apps read everything but secrets from the `e2e` profile
# in packages/config (APP_ENV=e2e). `stack:up` interpolates this file from
# ../../.generated/config.e2e.env (generated from the same profile) and
# .env.e2e (test-only secrets).
#
# Hostnames: everything is served from http://${DOMAIN}. Containers reach
# it through the network aliases on `web`; the browser reaches it because
# Playwright launches Chromium with --host-resolver-rules (see src/env.ts).

name: imageboard-e2e

x-app-env: &app-env
  APP_ENV: ${APP_ENV:?run npm run stack:up -w imageboard-e2e}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_MULTIPLE_DATABASES: ${DB_NAMES}
    volumes:
      - ../../sh/multiple-databases.sh:/docker-entrypoint-initdb.d/multiple-databases.sh:ro
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      # -h forces TCP: the temporary init-time server only listens on the unix
      # socket, so a socket check would report ready before the databases exist.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U ${DB_USER} -d ${DB_NAME_API}']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 15

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    ports:
      - '${E2E_MAILPIT_PORT}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 3s
      retries: 15

  minio:
    image: quay.io/minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    ports:
      - '${E2E_S3_PORT}:9000'
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 2s
      timeout: 3s
      retries: 15

  # One-shot: creates the bucket and makes it publicly readable, the way the
  # production bucket serves images to browsers.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID} ${S3_SECRET_ACCESS_KEY} &&
      mc mb --ignore-existing local/${S3_BUCKET} &&
      mc anonymous set download local/${S3_BUCKET}
      "

  image-processor:
    build:
      context: ../..
      dockerfile: apps/image-processor/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *app-env
    env_file:
      - .env.e2e
    volumes:
      - shared-data:/shared

  imageboard-identity-provider:
    build:
      context: ../..
      dockerfile: apps/imageboard-identity-provider/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
    env_file:
      - .env.e2e
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O /dev/null http://127.0.0.1:${IDP_PORT}/.well-known/openid-configuration',
        ]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  imageboard-api:
    build:
      context: ../..
      dockerfile: apps/imageboard-api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Discovers the issuer's JWKS at boot, via http://auth.${DOMAIN}.
      imageboard-identity-provider:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      <<: *app-env
    env_file:
      - .env.e2e
    volumes:
      - shared-data:/shared
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:${API_PORT}/ip']
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  imageboard-client:
    build:
      context: ../..
      dockerfile: apps/imageboard-client/Dockerfile
      target: production
      args:
        # The browser bundle inlines the public part of this profile.
        APP_ENV: ${APP_ENV}
    depends_on:
      imageboard-identity-provider:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      <<: *app-env
    env_file:
      - .env.e2e
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:${CLIENT_PORT}/']
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  # nginx front door: routes ${DOMAIN}, api.* and auth.* to the services.
  web:
    build:
      context: ../..
      dockerfile: apps/imageboard-web/Dockerfile
    environment:
      DOMAIN: ${DOMAIN}
      CLIENT_INTERNAL_URL: ${CLIENT_INTERNAL_URL}
      API_INTERNAL_URL: ${API_INTERNAL_URL}
      AUTH_SERVER_INTERNAL_URL: ${AUTH_SERVER_INTERNAL_URL}
    ports:
      - '${E2E_HTTP_PORT}:80'
    networks:
      default:
        aliases:
          - ${DOMAIN}
          - api.${DOMAIN}
          - auth.${DOMAIN}
    healthcheck:
      # Any HTTP response (even a 502 while upstreams boot) means nginx is up.
      test:
        [
          'CMD-SHELL',
          'wget -S -O /dev/null http://127.0.0.1/ 2>&1 | grep -q "HTTP/"',
        ]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  shared-data:
