$schema: './schema/video-transform-config.schema.json'
# variables.tile: the video's tile in the post gallery, laid out by the API's
# gallery layout engine (the same tile the image-transform config gets)
transform:
  # The video, at most 720p, played in the lightbox
  - - operation: scale
      args:
        width: 1280
        height: 720
        fit: inside
        withoutEnlargement: true
    - operation: h264
      args:
        crf: 23
        preset: medium
    - operation: save
      args:
        key: ${{file.name}}/video.mp4
        contentType: video/mp4
        metadata:
          variant: video
          hasAudio: ${{metadata.hasAudio}}

  # Poster of the lightbox video, shown before playback starts
  - - operation: frame
      args:
        time: 0
        format: jpeg
        quality: 85
    - operation: scale
      args:
        width: 1280
        height: 720
        fit: inside
        withoutEnlargement: true
    - operation: save
      args:
        key: ${{file.name}}/poster.jpeg
        contentType: image/jpeg
        metadata:
          variant: poster

  # Gallery tile: a short silent loop at the tile's size
  - - operation: trim
      args:
        duration: 3
    - operation: scale
      args:
        width: ${{variables.tile.width}}
        height: ${{variables.tile.height}}
        fit: ${{variables.tile.fit}}
    - operation: mute
      args: {}
    - operation: h264
      args:
        crf: 28
        preset: fast
    - operation: save
      args:
        key: ${{file.name}}/tile.mp4
        contentType: video/mp4
        metadata:
          variant: tile
          tile:
            key: ${{variables.tile.key}}
            width: ${{variables.tile.width}}
            height: ${{variables.tile.height}}
            fit: ${{variables.tile.fit}}
            column: ${{variables.tile.column}}
            row: ${{variables.tile.row}}
            columnSpan: ${{variables.tile.columnSpan}}
            rowSpan: ${{variables.tile.rowSpan}}

  # Poster of the gallery tile, shown until the loop plays
  - - operation: frame
      args:
        time: 0
        format: jpeg
        quality: 80
    - operation: scale
      args:
        width: ${{variables.tile.width}}
        height: ${{variables.tile.height}}
        fit: ${{variables.tile.fit}}
    - operation: save
      args:
        key: ${{file.name}}/tile-poster.jpeg
        contentType: image/jpeg
        metadata:
          variant: tilePoster
          tile:
            key: ${{variables.tile.key}}
            width: ${{variables.tile.width}}
            height: ${{variables.tile.height}}
            fit: ${{variables.tile.fit}}
            column: ${{variables.tile.column}}
            row: ${{variables.tile.row}}
            columnSpan: ${{variables.tile.columnSpan}}
            rowSpan: ${{variables.tile.rowSpan}}
