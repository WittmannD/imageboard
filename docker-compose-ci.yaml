# Production stack deployed by .github/workflows/deploy.yml. It is started with
# two env files: .env (secrets, from the APP_ENV GitHub secret) and config.env
# (generated from the production profile in packages/config).
version: '3.9'

x-app-env: &app-env
  APP_ENV: ${APP_ENV:?missing config.env, generated by bin/config-env.ts}

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:18-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME_API}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME_API}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-bridge

  imageboard-api:
    image: ghcr.io/wittmannd/imageboard-api:latest
    container_name: imageboard-api
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
    env_file:
      - .env
    volumes:
      - shared-data:/shared
    ports:
      - '${API_PORT}:${API_PORT}'
    networks:
      - app-bridge

  image-processor:
    image: ghcr.io/wittmannd/imageboard-image-processor:latest
    container_name: image-processor
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
    env_file:
      - .env
    volumes:
      - shared-data:/shared

volumes:
  pg-data:
  redis-data:
  shared-data:

networks:
  app-bridge:
    driver: bridge
