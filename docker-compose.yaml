# Local development stack. Start it with `npm run stack:dev`, which generates
# .generated/config.development.env from the shared configuration
# (packages/config) and passes it together with the root .env (secrets):
#
#   docker compose --env-file .env --env-file .generated/config.development.env up --build
#
# Apps read their settings from the APP_ENV profile themselves; only values
# compose and nginx need are interpolated here.
version: '3.9'

x-app-env: &app-env
  APP_ENV: ${APP_ENV:?generate it with npm run config:env -- development}

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - internal

  postgres:
    image: postgres:18-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_MULTIPLE_DATABASES: ${DB_NAMES}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - ./sh/multiple-databases.sh:/docker-entrypoint-initdb.d/multiple-databases.sh
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  pgweb:
    container_name: pgweb
    restart: always
    image: sosedoff/pgweb
    links:
      - postgres:postgres
    environment:
      - PGWEB_DATABASE_URL=postgres://${DB_USER}:${DB_PASS}@postgres:${DB_PORT}/postgres?sslmode=disable
    depends_on:
      - postgres
    networks:
      - internal
    ports:
      - "8081:8081"

  imageboard-web:
    build:
      context: .
      dockerfile: apps/imageboard-web/Dockerfile
    container_name: imageboard-web
    environment:
      DOMAIN: ${DOMAIN}
      API_INTERNAL_URL: ${API_INTERNAL_URL}
      CLIENT_INTERNAL_URL: ${CLIENT_INTERNAL_URL}
      AUTH_SERVER_INTERNAL_URL: ${AUTH_SERVER_INTERNAL_URL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./logs/nginx:/var/log/nginx
    networks:
      public:
        aliases:
          - ${DOMAIN}
          - api.${DOMAIN}
          - auth.${DOMAIN}

  imageboard-api:
    build:
      context: .
      dockerfile: apps/imageboard-api/Dockerfile
    container_name: imageboard-api
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      imageboard-identity-provider:
        condition: service_healthy
    environment:
      <<: *app-env
    volumes:
      - shared-data:/shared
    env_file:
      - './.env'
    networks:
      - internal
      - public

  image-processor:
    build:
      context: .
      dockerfile: apps/image-processor/Dockerfile
    container_name: image-processor
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
    env_file:
      - './.env'
    volumes:
      - shared-data:/shared
    networks:
      - internal

  imageboard-identity-provider:
    build:
      context: .
      dockerfile: apps/imageboard-identity-provider/Dockerfile
    container_name: imageboard-identity-provider
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      # Read by the `debug` library straight from the environment.
      DEBUG: ${IDP_DEBUG}
    env_file:
      - './.env'
    networks:
      - internal
      - public
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificat", "--no-verbose", "--tries=1", "--spider", "http://0.0.0.0:${IDP_PORT}/.well-known/openid-configuration"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  imageboard-client:
    build:
      context: .
      dockerfile: apps/imageboard-client/Dockerfile
      target: dev
    container_name: imageboard-client
    environment:
      <<: *app-env
    env_file:
      - './.env'
    ports:
      - "${CLIENT_PORT}:${CLIENT_PORT}"
    depends_on:
      imageboard-identity-provider:
        condition: service_healthy
    networks:
      - internal
      - public
    develop:
      watch:
        - action: sync
          path: ./apps/imageboard-client/src
          target: /usr/src/app/apps/imageboard-client/src
        - action: sync
          path: ./packages
          target: /usr/src/app/packages
        - action: sync+restart
          path: ./apps/imageboard-client/vite.config.ts
          target: /usr/src/app/apps/imageboard-client/vite.config.ts
        - action: sync+restart
          path: ./apps/imageboard-client/react-router.config.ts
          target: /usr/src/app/apps/imageboard-client/react-router.config.ts
        - action: rebuild
          path: ./apps/imageboard-client/package.json
        - action: rebuild
          path: ./package.json

volumes:
  pg-data:
  redis-data:
  shared-data:

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
