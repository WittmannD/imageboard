# Staging stack on its own server, deployed by .github/workflows/deploy-staging.yml.
#
# The same wiring as the e2e stack (apps/imageboard-e2e/docker-compose.e2e.yaml),
# but with the real services behind it: Filebase S3, real SMTP, persistent
# Postgres/Redis, and HTTPS through a Let's Encrypt certificate.
#
# It is started with two env files: .env (secrets, from the APP_ENV secret of
# the `staging` GitHub environment) and config.env (generated from the staging
# profile in packages/config, plus IMAGE_TAG pinning the deployed commit).
#
# TLS: `web` serves plain HTTP until the certificate exists (see
# apps/imageboard-web/docker-entrypoint.d). The deploy issues it with a one-off
# `certbot certonly` and restarts `web`; the `certbot` service renews it.

name: imageboard-staging

x-app-env: &app-env
  APP_ENV: ${APP_ENV:?missing config.env, generated by bin/config-env.ts}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_MULTIPLE_DATABASES: ${DB_NAMES}
    volumes:
      - ./sh/multiple-databases.sh:/docker-entrypoint-initdb.d/multiple-databases.sh:ro
      - pg-data:/var/lib/postgresql
    healthcheck:
      # -h forces TCP: the temporary init-time server only listens on the unix
      # socket, so a socket check would report ready before the databases exist.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U ${DB_USER} -d ${DB_NAME_API}']
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 15

  image-processor:
    image: ghcr.io/wittmannd/imageboard/image-processor:${IMAGE_TAG:-staging}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
    env_file:
      - .env
    volumes:
      - shared-data:/shared

  imageboard-identity-provider:
    image: ghcr.io/wittmannd/imageboard/imageboard-identity-provider:${IMAGE_TAG:-staging}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      # Read by the `debug` library straight from the environment.
      DEBUG: ${IDP_DEBUG}
    env_file:
      - .env
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O /dev/null http://127.0.0.1:${IDP_PORT}/.well-known/openid-configuration',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  imageboard-api:
    image: ghcr.io/wittmannd/imageboard/imageboard-api:${IMAGE_TAG:-staging}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Discovers the issuer's JWKS at boot, via https://auth.${DOMAIN}.
      imageboard-identity-provider:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      <<: *app-env
    env_file:
      - .env
    volumes:
      - shared-data:/shared
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:${API_PORT}/ip']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  imageboard-client:
    # Built with APP_ENV=staging: the browser bundle inlines the staging profile.
    image: ghcr.io/wittmannd/imageboard/imageboard-client:${IMAGE_TAG:-staging}
    restart: unless-stopped
    depends_on:
      imageboard-identity-provider:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      <<: *app-env
    env_file:
      - .env
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:${CLIENT_PORT}/']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # nginx front door: routes ${DOMAIN}, api.* and auth.* to the services and
  # terminates TLS.
  web:
    image: ghcr.io/wittmannd/imageboard/imageboard-web:${IMAGE_TAG:-staging}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      CLIENT_INTERNAL_URL: ${CLIENT_INTERNAL_URL}
      API_INTERNAL_URL: ${API_INTERNAL_URL}
      AUTH_SERVER_INTERNAL_URL: ${AUTH_SERVER_INTERNAL_URL}
      TLS_ENABLED: 'true'
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    networks:
      default:
        # Containers reach the public hostnames (e.g. the OIDC issuer) through
        # nginx, with the same certificate the browser sees.
        aliases:
          - ${DOMAIN}
          - api.${DOMAIN}
          - auth.${DOMAIN}
    healthcheck:
      # Any HTTP response (even a 502 while upstreams boot) means nginx is up.
      test:
        [
          'CMD-SHELL',
          'wget -S -O /dev/null http://127.0.0.1/ 2>&1 | grep -q "HTTP/"',
        ]
      interval: 5s
      timeout: 3s
      retries: 15

  # Renews the certificate; nginx reloads it every 6 hours. Issuance is a
  # one-off `docker compose run --entrypoint certbot certbot certonly ...` in
  # the deploy.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
      certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!};
      done"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot

volumes:
  pg-data:
  redis-data:
  shared-data:
  letsencrypt:
  certbot-www:
